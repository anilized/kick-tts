# Kick unsubscribes webhooks after a day of failed deliveries. This re-checks the subscriptions every 6 h
# and re-creates any that are missing (scripts/kick_subscribe.py ensure; see docs/KICK_SETUP.md).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kick-tts-subscribe
  labels:
    app: kick-tts
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: kick-tts-subscribe
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: ensure
              image: kick-tts:0.1.0
              imagePullPolicy: IfNotPresent
              command: ["python", "scripts/kick_subscribe.py", "ensure"]
              envFrom:
                - secretRef:
                    name: kick-tts-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
