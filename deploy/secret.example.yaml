# Template only. Copy to a file outside git (e.g. secret.local.yaml, which .gitignore excludes),
# replace every CHANGE_ME, then:  kubectl apply -n streaming -f secret.local.yaml
# Generate tokens with:  python -c "import secrets; print(secrets.token_urlsafe(32))"
apiVersion: v1
kind: Secret
metadata:
  name: kick-tts-secrets
  labels:
    app: kick-tts
type: Opaque
stringData:
  CONTROL_TOKEN: CHANGE_ME          # bearer token for /speak, /skip, /clear, /pause, /resume, /status
  OVERLAY_KEY: CHANGE_ME            # ?key= for /overlay and /ws (goes into the OBS browser-source URL)
  ANTHROPIC_API_KEY: CHANGE_ME      # delete this line for rules-only mode (a placeholder value would be sent to the API and fall back)
  KICK_CLIENT_ID: CHANGE_ME         # Kick developer app: kick-tts-subscribe CronJob + "Continue with Kick" on /panel
  KICK_CLIENT_SECRET: CHANGE_ME
  DISCORD_CLIENT_ID: CHANGE_ME      # Discord application for "Continue with Discord" on /panel; delete both lines to hide the button
  DISCORD_CLIENT_SECRET: CHANGE_ME
  KICK_BROADCASTER_USER_ID: "0"     # 0 = accept any broadcaster; set the real id once `kick_subscribe.py resolve` printed it
