host: api.kick.com
info:
  contact:
    email: support@kick.com
    name: Kick Support
    url: https://help.kick.com/en/
  description: Kick Developer Public API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Kick Dev Public API
  version: 1.0.0
paths:
  /oauth/authorize:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: |-
        Authorize endpoint for the OAuth 2.1 flow. OAuth endpoint is https://id.kick.com.
        The state is a random string that is generated by the client and is used to prevent CSRF attacks
        In this handler we are required to store all of these parameters that have been parsed and attach them to the request
        object for use by the oauth2 server.

        Once successful this endpoint will redirect the user to the redirect_uri with the
        code and state in the query string following this format:

        https://www.redirect-uri.com/callback
        ?state=G8VdYFIzdbIVhaz8
        &code=KrPx-1uqXmq6haTWG8I8F1VMutnA6AQANY-fB9aBa-j1nXCH.
      parameters:
      - description: code
        in: formData
        name: response_type
        required: true
        type: string
      - description: 88STyxwAAtoENitgyo19l000
        in: formData
        name: client_id
        required: true
        type: string
      - description: https://www.client-app.com/oauth/callback
        in: formData
        name: redirect_uri
        required: true
        type: string
      - description: chat:read channel:read
        in: formData
        name: scope
        required: true
        type: string
      - description: random_value
        in: formData
        name: state
        required: true
        type: string
      - description: Qn3Kywp0OiU4NK_AFzGPlmrcYJDJ13Abj_jdL08Ahg8%3D
        in: formData
        name: code_challenge
        required: true
        type: string
      - description: S256
        in: formData
        name: code_challenge_method
        required: true
        type: string
      produces:
      - application/x-www-form-urlencoded
      responses:
        "302":
          description: Found
        "400":
          description: bad or unregistered redirect_uri, or otherwise invalid authorization
            request
          schema:
            $ref: '#/definitions/endpoints.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/endpoints.HTTPError'
      summary: Authorize endpoint
      tags:
      - oauth
  /oauth/revoke:
    post:
      consumes:
      - application/json
      description: This endpoint will revoke access for a token.
      parameters:
      - description: token value
        in: query
        name: token
        required: true
        type: string
      - description: access_token, refresh_token
        in: query
        name: token_type_hint
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: OAuth Revoke
      tags:
      - oauth
  /oauth/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: |-
        Token endpoint for the OAuth 2.1 flow. OAuth endpoint is https://id.kick.com.
        POST https://id.kick.com/oauth/token
        ?grant_type=authorization_code
        &client_id=88STyxwAAtoENitgyo19l25v
