basePath: ""
definitions:
  endpoints.AcceptChannelRewardRedemptionsParams:
    properties:
      ids:
        description: List of redemption IDs to accept. A maximum of 25 redemptions
          can be accepted per request. IDs must be unique.
        example:
        - 01KEWZ2RKYZZFGD154K50Y3F8D
        - 01KEWZ2YC27070XWMHKFJR6C87
        items:
          format: ulid
          type: string
        maxItems: 25
        minItems: 1
        type: array
        uniqueItems: true
    required:
    - ids
    type: object
  endpoints.AdBreak:
